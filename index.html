<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al Rahman Blessings | Premium Attar</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background-color: #fff; color: #1a1a1a; }

        /* Logo Design: Al Rahman on top, Blessings below */
        header { padding: 30px; text-align: center; background: #fff; border-bottom: 1px solid #eee; }
        .logo-top { 
            font-family: 'Playfair Display', serif; font-size: 35px; font-weight: 900; 
            color: #b08d57; text-transform: uppercase; letter-spacing: 3px; line-height: 1;
        }
        .logo-bottom { 
            font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 400; 
            color: #333; text-transform: uppercase; letter-spacing: 8px; margin-top: 5px;
        }

        /* Hero Section (Aapki Background Image) */
        .hero {
            height: 70vh;
            background: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.1)), 
                        url('https://i.ibb.co/hF6vN1HR/bg-image.jpg') no-repeat center center;
            background-size: cover;
            image-rendering: -webkit-optimize-contrast;
        }

        /* Product Gallery */
        .section { padding: 60px 8%; text-align: center; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        .product-card { border: 1px solid #f2f2f2; padding: 15px; background: #fff; border-radius: 8px; transition: 0.3s; }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .product-card img, .product-card video { width: 100%; height: 350px; object-fit: cover; border-radius: 5px; }
        
        .buy-btn {
            display: inline-block; padding: 10px 20px; background: #b08d57; color: #fff;
            text-decoration: none; margin-top: 15px; font-weight: bold; border-radius: 4px;
        }

        /* Permanent Upload Button Style */
        .admin-zone {
            background: #fdfaf5; border: 2px dashed #b08d57;
            margin: 50px 8%; padding: 40px; text-align: center; border-radius: 15px;
        }
        #upload_widget {
            padding: 15px 30px; background: #1a1a1a; color: #fff; border: none;
            font-size: 16px; cursor: pointer; border-radius: 5px; font-weight: 600;
        }
        #upload_widget:hover { background: #b08d57; }
    </style>
</head>
<body>

    <header>
        <div class="logo-top">Al Rahman</div>
        <div class="logo-bottom">Blessings</div>
    </header>

    <div class="hero"></div>

    <section class="section">
        <h2>Our Collection</h2>
        <div class="product-grid" id="gallery">
            <div class="product-card">
                <img src="https://i.ibb.co/CshKB2GS/image.jpg" alt="Product">
                <h3>White Oud</h3>
                <a href="https://wa.me/918383983217" class="buy-btn">Inquiry</a>
            </div>
        </div>
    </section>

    <div class="admin-zone">
        <h3 style="margin-bottom: 20px;">Admin Panel: Upload Video or Photo</h3>
        <button id="upload_widget" class="cloudinary-button">Direct Upload (Select File)</button>
        <p style="margin-top: 15px; font-size: 13px; color: #666;">Photos & Videos uploaded here will be saved permanently.</p>
    </div>

    <script type="text/javascript">  
        var myWidget = cloudinary.createUploadWidget({
          cloudName: 'demo', // Yahan aapka Cloudinary name aayega
          uploadPreset: 'unsigned_preset' // Yahan aapka preset aayega
        }, (error, result) => { 
            if (!error && result && result.event === "success") { 
              console.log('Done! Here is the info: ', result.info); 
              const gallery = document.getElementById('gallery');
              const card = document.createElement('div');
              card.className = 'product-card';

              if(result.info.resource_type === 'video') {
                  card.innerHTML = `<video src="${result.info.secure_url}" controls></video>`;
              } else {
                  card.innerHTML = `<img src="${result.info.secure_url}">`;
              }
              
              card.innerHTML += `<h3>New Arrival</h3><a href="https://wa.me/918383983217" class="buy-btn">Inquiry</a>`;
              gallery.prepend(card);
            }
        });

        document.getElementById("upload_widget").addEventListener("click", function(){
            myWidget.open();
        }, false);
    </script>

</body>
</html>
