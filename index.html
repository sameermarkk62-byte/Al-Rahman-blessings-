<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al Rahman Blessings</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
</head>
<body style="text-align:center; font-family: sans-serif; padding-top: 50px;">
    <h1 style="color:#b08d57;">Al Rahman Blessings</h1>
    <div id="gallery" style="display:flex; flex-wrap:wrap; justify-content:center; gap:20px; padding:20px;"></div>
    
    <div style="margin-top:50px; padding:30px; border:2px dashed #ccc;">
        <h3>Manager: Upload New Product</h3>
        <button id="upload_widget" style="padding:15px 30px; background:#b08d57; color:#fff; border:none; border-radius:5px; cursor:pointer;">Add Photo to Gallery</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD3lpaR8LSWvllmrSqTNLcj-clS",
            databaseURL: "https://al-rahman-website-default-rtdb.firebaseio.com/",
            projectId: "al-rahman-website"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref('products');

        var myWidget = cloudinary.createUploadWidget({
            cloudName: 'duhdg8hcw', uploadPreset: 'Mahmat'
        }, (error, result) => { 
            if (!error && result && result.event === "success") { 
                db.push({ url: result.info.secure_url, type: result.info.resource_type });
                alert("Photo Save Ho Gayi!");
            }
        });
        document.getElementById("upload_widget").onclick = () => myWidget.open();

        db.on('child_added', (snapshot) => {
            const data = snapshot.val();
            const img = document.createElement('img');
            img.src = data.url;
            img.style.width = "250px";
            img.style.borderRadius = "10px";
            document.getElementById('gallery').prepend(img);
        });
    </script>
</body>
</html>
